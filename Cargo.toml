[package]
name = "autoruns-rs"
version = "0.3.0"
edition = "2021"

[dependencies]
eframe = "0.29"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Com",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true